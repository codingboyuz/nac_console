# RADIUS clients (NAS = Huawei switches). Replace placeholders; one block per management
# subnet or switch. The secret must match 'radius-server shared-key' in the switch template
# generated by POST /api/v1/nac/provisioning/preview.
client huawei-mgmt {
	ipaddr = <MGMT_SUBNET_CIDR>
	secret = <RADIUS_SHARED_SECRET>
	require_message_authenticator = yes
	nas_type = other
}
