repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy app
        language: system
        pass_filenames: false
        types: [python]
      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml -r app -q
        language: system
        pass_filenames: false
        types: [python]
